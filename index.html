<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- 禁止整页缩放（用户）：手机上大面积是地图，双指捏合应只缩放地图，不要误触把整页放大。
         maximum-scale=1 + user-scalable=no 关掉浏览器页面缩放；Google 地图自有手势不受影响。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1f2d2d" />
    <title>忘れられた傘 | 都市の片隅の地図</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icons/favicon.svg?v=159" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=179" />
  </head>
  <body>
    <section class="welcome-screen" id="welcome-screen" aria-label="welcome">
      <div class="welcome-crosshair" id="welcome-crosshair" aria-hidden="true">
        <svg class="crosshair-filter" focusable="false">
          <defs>
            <filter id="filter-noise-x">
              <feTurbulence id="filter-x-turbulence" type="fractalNoise" baseFrequency="0.000001" numOctaves="1" />
              <feDisplacementMap in="SourceGraphic" scale="40" />
            </filter>
            <filter id="filter-noise-y">
              <feTurbulence id="filter-y-turbulence" type="fractalNoise" baseFrequency="0.000001" numOctaves="1" />
              <feDisplacementMap in="SourceGraphic" scale="40" />
            </filter>
            <filter id="filter-noise-image">
              <feTurbulence id="filter-image-turbulence" type="fractalNoise" baseFrequency="0.000001" numOctaves="1" />
              <feDisplacementMap in="SourceGraphic" scale="13" />
            </filter>
          </defs>
        </svg>
        <span class="crosshair-line crosshair-line-x" id="crosshair-line-x"></span>
        <span class="crosshair-line crosshair-line-y" id="crosshair-line-y"></span>
        <span class="crosshair-ring" id="crosshair-ring"></span>
      </div>

      <button class="welcome-title" id="enter-site" type="button" aria-label="enter site">
        <span class="welcome-title-frame" aria-hidden="true">
          <span class="welcome-title-text">
            <span class="welcome-title-line" data-text="FORGOTTEN"></span>
            <span class="welcome-title-line" data-text="UMBRELLAS"></span>
          </span>
          <span class="welcome-title-media">
            <img class="welcome-card is-active" src="filebox/welcome-pic/2.png" alt="" />
          </span>
        </span>
      </button>
    </section>

    <div class="app-shell">
      <header class="topbar" aria-label="top navigation">
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="view-tabs"
          aria-label="menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
          </svg>
        </button>
        <nav class="view-tabs" id="view-tabs" aria-label="view switcher">
          <button class="tab is-active" data-view="map" type="button">Umbrella map</button>
          <button class="tab" data-view="archive" type="button">Archive</button>
          <button class="tab" data-view="about" type="button">About</button>
          <button class="tab tab-submit" data-view="submit" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="m17 8-5-5-5 5" />
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            </svg>
            <span>Submit</span>
          </button>
          <div class="language-switcher">
            <!-- v155: 点击直接循环切换语言（ja↔en），不再展开下拉。当前语言那一段加粗（用户 item14）。 -->
            <button
              id="language-toggle"
              class="language-toggle"
              type="button"
              aria-label="switch language"
            >
              <svg class="language-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                <path d="M2 12h20" />
              </svg>
              <span class="lang-opt" data-lang="ja">Ja</span>
              <span class="lang-sep" aria-hidden="true">/</span>
              <span class="lang-opt" data-lang="en">En</span>
            </button>
          </div>
        </nav>
      </header>

      <main>
        <section class="workspace view is-active is-list-collapsed" id="map-view" aria-label="map view">
          <section class="map-stage" aria-label="umbrella locations">
            <div class="city-map" id="city-map">
              <div id="google-map" class="google-map" role="application" aria-label="Google map"></div>
              <div id="map-message" class="map-message" hidden></div>
            </div>
          </section>

          <button
            id="toggle-list"
            class="panel-toggle panel-toggle-left"
            type="button"
            aria-label="expand location list"
            aria-controls="list-panel"
            aria-expanded="false"
            title="expand location list"
          >
            <span aria-hidden="true">
              <!-- 收起时=open 图标（桌面 panel-left-open / 手机 panel-bottom-open）；
                   展开后=close 图标（桌面 panel-left-close / 手机 panel-bottom-close）。
                   桌面/手机按屏宽切、open/close 按 aria-expanded 切，都在 CSS 里控制（用户 item10）。 -->
              <svg class="panel-ico panel-ico-desktop panel-ico-open" viewBox="0 0 24 24" focusable="false">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M9 3v18" />
                <path d="m14 9 3 3-3 3" />
              </svg>
              <svg class="panel-ico panel-ico-desktop panel-ico-close" viewBox="0 0 24 24" focusable="false">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M9 3v18" />
                <path d="m16 15-3-3 3-3" />
              </svg>
              <svg class="panel-ico panel-ico-mobile panel-ico-open" viewBox="0 0 24 24" focusable="false">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M3 15h18" />
                <path d="m9 10 3-3 3 3" />
              </svg>
              <svg class="panel-ico panel-ico-mobile panel-ico-close" viewBox="0 0 24 24" focusable="false">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M3 15h18" />
                <path d="m15 8-3 3-3-3" />
              </svg>
            </span>
          </button>

          <div class="map-layer-tools" id="map-layer-tools">
            <button id="map-type-toggle" class="map-layer-btn map-type-btn" type="button" aria-label="switch map" title="switch map">
              <span class="map-type-ico" aria-hidden="true"></span>
            </button>

            <div class="map-filter" id="map-filter">
              <button id="map-filter-toggle" class="map-layer-btn" type="button" aria-expanded="false" aria-label="filter markers" title="filter markers">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12.248 21.969a1 1 0 0 1-.849-.17C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0c0 .42-.039.841-.112 1.262" />
                  <path d="m22 22-1.88-1.88" />
                  <circle cx="12" cy="10" r="3" />
                  <circle cx="18" cy="18" r="3" />
                </svg>
              </button>
              <div class="map-filter-panel" id="map-filter-panel" hidden></div>
            </div>

            <div class="map-filter" id="map-layers">
              <button id="map-layers-toggle" class="map-layer-btn" type="button" aria-expanded="false" aria-label="map labels" title="map labels">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z" />
                  <path d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193" />
                  <circle cx="10.5" cy="6.5" r=".5" fill="currentColor" />
                </svg>
              </button>
              <div class="map-filter-panel" id="map-layers-panel" hidden></div>
            </div>

            <div class="map-filter" id="blur-adjust">
              <button id="blur-adjust-toggle" class="map-layer-btn" type="button" aria-expanded="false" aria-label="聚焦模糊度调整（编辑用）" title="聚焦模糊度调整（编辑用）">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                  <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                  <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                  <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                </svg>
              </button>
              <div class="map-filter-panel" id="blur-adjust-panel" hidden></div>
            </div>
          </div>

          <aside class="side-panel" id="list-panel" aria-label="location list">
            <div class="panel-heading panel-scope-tabs" role="group" aria-label="list scope">
              <button class="panel-scope-tab is-active" data-list-scope="own" type="button"><h2>Fieldwork</h2></button>
              <button class="panel-scope-tab" data-list-scope="contributed" type="button"><h2>Contributed</h2></button>
            </div>

            <div class="search-shell">
              <button id="search-toggle" class="search-toggle" type="button" aria-expanded="false" aria-label="open search">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.34-4.34" />
                </svg>
              </button>
            </div>
            <label class="search-box" hidden>
              <input id="search-input" type="search" placeholder="ID, place, type, story..." />
            </label>

            <div class="filter-row" aria-label="map archive sorting">
              <button class="chip is-active" data-list-sort="time" type="button"><span data-i18n="sortTime">時間</span><span class="sort-arrow" aria-hidden="true"></span></button>
              <button class="chip" data-list-sort="type" type="button"><span data-i18n="sortType">種類</span></button>
              <button class="chip" data-list-sort="place" type="button"><span data-i18n="sortPlace">場所</span></button>
            </div>

            <div class="list-secondary-row" id="list-secondary-row" hidden></div>

            <div class="archive-list" id="archive-list" aria-live="polite"></div>
          </aside>

          <!-- 右下角：定位按钮(navigation，去当前位置)在上、139item 计数(show all items)在下。
               定位按钮原来在左上横幅，按用户 item4 整个移到这里，不是新增装饰图标。 -->
          <div class="map-toolbar" id="map-toolbar">
            <button id="locate-me" class="map-locate-btn" type="button" aria-label="go to my location" title="go to my location">
              <svg class="locate-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <polygon points="3 11 22 2 13 21 11 13 3 11" />
              </svg>
            </button>
            <button id="reset-map" class="map-reset-btn" type="button" aria-label="show all items" title="show all items">
              <span id="result-count"></span>
            </button>
          </div>

          <div class="focus-blur" id="focus-blur" aria-hidden="true"></div>
          <div class="focus-approx-label" id="focus-approx-label" aria-hidden="true" hidden></div>
          <div class="focus-gesture-tip" id="focus-gesture-tip" aria-hidden="true" hidden>
            <span class="focus-gesture-dots"><i></i><i></i></span>
            <span>Pinch to zoom map</span>
          </div>
          <button class="focus-mobile-back" id="focus-mobile-back" type="button" aria-label="back to map" title="back to map">
            <svg viewBox="0 0 56 30" aria-hidden="true" focusable="false">
              <path d="M54 6H16a7 7 0 0 0-7 7v9" />
              <path d="M3.5 17 9 23.5 14.5 17" />
            </svg>
            <span>Back to map</span>
          </button>

          <figure class="focus-image-panel" id="focus-image-panel" aria-live="polite" aria-hidden="true">
            <!-- 手机端底部抽屉的拖动把手（仅 ≤820px 显示）。点一下在「低档/全屏」两档间切换；
                 拖动手势在第2阶段接。 -->
            <button class="focus-sheet-handle" id="focus-sheet-handle" type="button" aria-label="展开/收起详情" title="展开/收起详情"><svg class="focus-sheet-hint" viewBox="0 0 24 14" aria-hidden="true" focusable="false"><path d="M4 10l8-6 8 6" /></svg></button>
            <div class="focus-scroll" id="focus-scroll">
              <div class="focus-stage">
                <div class="focus-image-frame">
                  <img id="focus-image" alt="" />
                  <video id="focus-expanded-video" class="focus-expanded-video" playsinline controls hidden></video>
                  <button class="focus-sheet-close" id="focus-sheet-close" type="button" aria-label="close detail" title="close detail">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M18 6 6 18" />
                      <path d="m6 6 12 12" />
                    </svg>
                  </button>
                  <!-- 放大后后台下载原图时的进度条（左下角胶囊，无文字）。 -->
                  <div class="focus-hires-bar" id="focus-hires-bar" aria-hidden="true"><span class="focus-hires-fill"></span></div>
                  <header class="focus-overlay-head focus-header" id="focus-header"></header>
                  <div class="focus-overlay-info" id="focus-info-block"></div>
                  <button class="focus-zoom-hint" id="focus-zoom-hint" type="button" aria-label="enlarge image" title="enlarge image">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <circle cx="11" cy="11" r="8" />
                      <line x1="21" x2="16.65" y1="21" y2="16.65" />
                      <line x1="11" x2="11" y1="8" y2="14" />
                      <line x1="8" x2="14" y1="11" y2="11" />
                    </svg>
                  </button>
                  <div class="focus-expanded-caption" id="focus-expanded-caption" hidden></div>
                </div>
                <div class="focus-link" id="focus-link" hidden></div>
                <figcaption class="focus-flow" id="focus-caption"></figcaption>
              </div>
            </div>
            <div class="focus-footer">
              <button class="focus-close" id="focus-close" type="button" aria-label="back to map" title="back to map">
                <svg viewBox="0 0 56 30" aria-hidden="true" focusable="false">
                  <path d="M54 6H16a7 7 0 0 0-7 7v9" />
                  <path d="M3.5 17 9 23.5 14.5 17" />
                </svg>
                <span class="focus-close-label">Back to map</span>
              </button>
              <div class="focus-scroll-hint" id="focus-scroll-hint" aria-hidden="true" hidden>
                <span class="focus-scroll-hint-label">Scroll for more</span>
                <svg viewBox="0 0 24 14" aria-hidden="true" focusable="false">
                  <path d="M4 4l8 6 8-6" />
                </svg>
              </div>
            </div>
          </figure>

          <!-- 手机端：拖动/缩放地图时详情抽屉收起，露出这个「展开」胶囊按钮把它叫回来（仅 ≤820px）。 -->
          <button class="focus-expand" id="focus-expand" type="button" aria-label="展开详情" title="展开详情">
            <svg viewBox="0 0 24 14" aria-hidden="true" focusable="false"><path d="M4 10l8-6 8 6" /></svg>
            <span class="focus-expand-label">show umbrella</span>
          </button>

          <div class="focus-thumbs" id="focus-thumbs" aria-label="image thumbnails" hidden></div>
        </section>

        <section class="archive-view view" id="archive-view" aria-label="archive view">
          <div class="section-heading" role="group" aria-label="archive scope">
            <h2 class="archive-scope-heading">
              <span class="archive-scope-prefix">Archive (</span><button class="archive-scope-tab is-active" data-archive-scope="own" type="button">Fieldwork</button><span class="archive-scope-sep"> / </span><button class="archive-scope-tab" data-archive-scope="contributed" type="button">Contributed</button><span class="archive-scope-suffix">)</span>
            </h2>
          </div>

          <div class="archive-toolbar" id="archive-own-toolbar" aria-label="archive controls">
            <p data-i18n="sortBy">並び替え</p>
            <div class="archive-primary-row">
              <div class="archive-toolbar-group" role="group" aria-label="sort mode">
                <button class="archive-control is-active" data-archive-mode="time" type="button"><span data-i18n="sortTime">時間</span><span class="sort-arrow" aria-hidden="true"></span></button>
                <button class="archive-control" data-archive-mode="type" type="button"><span data-i18n="sortType">種類</span></button>
                <button class="archive-control" data-archive-mode="place" type="button"><span data-i18n="sortPlace">場所</span></button>
                <button class="archive-control" data-archive-mode="stats" type="button"><span data-i18n="statsTab">統計</span></button>
              </div>
            </div>
            <div class="archive-secondary-row" id="archive-secondary-row" hidden></div>
          </div>

          <div class="archive-content" id="archive-content"></div>
          <div class="archive-content" id="contributed-content" hidden></div>
        </section>

        <section class="about-view view" id="about-view" aria-label="about project">
          <div class="about-copy" id="about-copy"></div>
          <aside class="about-side">
            <dl class="about-stats">
              <div>
                <dt id="stat-count">0</dt>
                <dd data-i18n="aboutStatLocations">記録された地点</dd>
              </div>
              <div>
                <dt id="stat-fieldwork">0</dt>
                <dd data-i18n="aboutStatFieldwork">フィールド数</dd>
              </div>
              <div>
                <dt id="stat-submissions">0</dt>
                <dd data-i18n="aboutStatSubmissions">投稿数</dd>
              </div>
              <div>
                <dt id="stat-since">2025.03</dt>
                <dd data-i18n="aboutStatSince">記録開始</dd>
              </div>
            </dl>
            <div class="about-legend" id="about-legend" aria-label="map legend"></div>
          </aside>
        </section>

      </main>
    </div>

    <script src="app.js?v=179" type="module"></script>
  </body>
</html>
